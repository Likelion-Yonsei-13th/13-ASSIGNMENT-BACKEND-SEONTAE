{% extends 'base.html' %}

{% block content %}
    <h1>상품 등록</h1>
    {% if user.is_authenticated %}
        <!-- 로그인한 사용자: 상품 등록 폼을 표시 -->
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">상품명</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="discript">상품 설명</label>
                <textarea id="discript" name="discript" rows="5" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="price">가격</label>
                <!-- decimal_places=0 이므로 정수 형태 입력 -->
                <input type="number" id="price" name="price" required>
            </div>
            
            <button type="submit" class="submit-btn">저장</button>
        </form>
    {% else %}
        <!-- 로그인하지 않은 사용자: 로그인 유도 메시지 -->
        <p>로그인한 사용자만 상품을 등록할 수 있습니다. <a href="{% url 'login' %}">로그인</a></p>
    {% endif %}
    
    <!-- 목록으로 돌아가는 링크 -->
    <div>
        <a class="back-link" href="/shop">← 목록으로</a>
    </div>
{% endblock content %}
