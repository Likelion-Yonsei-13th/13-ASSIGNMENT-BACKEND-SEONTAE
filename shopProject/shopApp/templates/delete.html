{% extends 'base.html' %}
{% block content %}
    <style>
        .content-box h1 {
            color: #dc3545;
            margin-bottom: 20px;
        }
        .content-box p {
            font-size: 16px;
            color: #333;
        }
    </style>
    
    {% if user.is_authenticated and user == product.registrant %}
        <script>
            // 페이지가 로드되면 자동으로 삭제 폼을 제출합니다.
            window.onload = function() {
                document.getElementById('deleteForm').submit();
            }
        </script>

        <div class="content-box">
            <h1>삭제 중...</h1>
            <p>상품 정보를 삭제하고 있습니다. 잠시만 기다려주세요.</p>
            <!-- CSRF 토큰이 포함된 폼이 자동 제출됨 -->
            <form id="deleteForm" method="POST">
                {% csrf_token %}
            </form>
        </div>
    {% else %}
        <div class="content-box">
            <h1>삭제 권한 없음</h1>
            <p>본인의 게시물이 아니므로 삭제할 수 없습니다.</p>
            <a class="back-link" href="/shop">목록으로</a>
        </div>
    {% endif %}
{% endblock content %}
