{% extends 'base.html' %}

{% block content %}
    <style>
        .content-box {
            max-width: 700px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .submit-btn {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover {
            color: #333;
            text-decoration: underline;
        }
    </style>

    {% if user.is_authenticated and user == product.registrant %}
        <div class="content-box">
            <h1>상품 수정</h1>
            <!-- 수정 폼: 기존 상품 정보가 value 속성 및 textarea 내부에 채워져 있음 -->
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">상품명</label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required>
                </div>
                <div class="form-group">
                    <label for="discript">상품 설명</label>
                    <textarea id="discript" name="discript" rows="5" required>{{ product.discript }}</textarea>
                </div>
                <div class="form-group">
                    <label for="price">가격</label>
                    <input type="number" id="price" name="price" value="{{ product.price }}" required>
                </div>
                <button type="submit" class="submit-btn">수정 완료</button>
            </form>
            <div>
                <a class="back-link" href="/shop/{{ product.id }}">← 상세 페이지로</a>
            </div>
        </div>
    {% else %}
        <div class="content-box">
            <h1>수정 권한 없음</h1>
            <p>본인의 게시물이 아니므로 수정할 수 없습니다.</p>
            <a class="back-link" href="/shop/{{ product.id }}">← 상세 페이지로</a>
        </div>
    {% endif %}
{% endblock content %}
