{% extends 'base.html' %}

{% block content %}
    <style>
        .button-container {
            text-align: left;
            margin-bottom: 20px;
        }
        .button {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead tr:hover {
            background-color: transparent;
            cursor: default;
        }
        thead th {
            background-color: #fafafa;
        }
        tbody tr:hover {
            background-color: #f0f0f0;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        tbody tr {
            cursor: pointer;
        }
    </style>

    <div class="content-box">
        <h1>상품 목록</h1>
        <div class="button-container">
            <button class="button" onclick="location.href='/shop/create'">+ 새상품 등록</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>상품명</th>
                    <th>가격</th>
                    <th>상품 등록자</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                    <tr onclick="location.href='/shop/{{ product.id }}'">
                        <td>{{ product.name }}</td>
                        <td>{{ product.price }}원</td>
                        <td>{{ product.registrant.username }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3" style="text-align:center;">등록된 상품이 없습니다.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock content %}
