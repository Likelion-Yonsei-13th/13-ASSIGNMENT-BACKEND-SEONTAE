{% extends 'base.html' %}

{% block content %}
    <style>
        .content-box {
            max-width: 700px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .product-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .divider {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
        .product-price {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .product-discript {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }
        .product-registrant {
            font-size: 16px;
            margin-bottom: 30px;
            color: #333;
        }
        .button-group {
            text-align: center;
        }
        .btn {
            display: inline-block;
            margin: 0 5px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-edit {
            background-color: #007BFF;
            color: #fff;
        }
        .btn-delete {
            background-color: #dc3545;
            color: #fff;
        }
        .btn-list {
            background-color: #6c757d;
            color: #fff;
        }
    </style>

    <div class="content-box">
        <div class="product-name">{{ product.name }}</div>
        <hr class="divider">
        <div class="product-price">
            <span class="icon">💰</span>
            {{ product.price }}원
        </div>
        <div class="product-discript">
            {{ product.discript }}
        </div>
        <!-- 신규: 상품 등록자 정보 -->
        <div class="product-registrant">
            상품 등록자: {{ product.registrant.username }}
        </div>
        <div class="button-group">
            <button class="btn btn-edit" onclick="location.href='/shop/{{ product.id }}/edit'">수정</button>
            <button class="btn btn-delete" onclick="location.href='/shop/{{ product.id }}/delete'">삭제</button>
            <button class="btn btn-list" onclick="location.href='/shop'">목록으로</button>
        </div>
    </div>
{% endblock content %}
